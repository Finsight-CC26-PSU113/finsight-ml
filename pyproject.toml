[project]
name = "finsight-ml"
version = "2.0.0"
description = "OCR receipt scanning ML service"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26.0,<2.0",
    "opencv-python-headless==4.10.0.84",
    "Pillow>=10.0.0,<11.0",
    "tensorflow==2.15.1",
    "torch==2.1.2",
    "torchvision==0.16.2",
    "easyocr==1.7.1",
    "pandas>=2.0.0,<2.3",
    "scikit-learn>=1.3.0,<1.6",
    "fastapi>=0.104.0,<0.120",
    "uvicorn[standard]>=0.24.0,<0.35",
    "python-multipart>=0.0.6",
    "matplotlib>=3.7.0,<4.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["google-generativeai>=0.7.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
