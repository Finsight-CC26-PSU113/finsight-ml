version: "3.8"

services:
  ocr-finsight:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-finsight:latest
    container_name: ocr-finsight
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - TF_CPP_MIN_LOG_LEVEL=2
      # Force CPU mode for portability
      - CUDA_VISIBLE_DEVICES=-1
    volumes:
      # Mount models directory (read-only) so you can update without rebuilding
      - ./models:/app/models:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:5000/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
