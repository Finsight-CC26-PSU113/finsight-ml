version: "3.8"

services:
  ocr-finsight:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-finsight:latest
    container_name: ocr-finsight
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - TF_CPP_MIN_LOG_LEVEL=2
      - CUDA_VISIBLE_DEVICES=-1
    volumes:
      # Mount models directory (read-only) — update model tanpa rebuild image
      - ./models/classifier_v2:/app/models/classifier_v2:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
