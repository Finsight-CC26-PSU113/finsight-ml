<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCR FinSight - Receipt Scanner</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
      }

      .header {
        background: linear-gradient(135deg, #1e293b, #334155);
        padding: 20px 40px;
        border-bottom: 1px solid #475569;
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .header h1 {
        font-size: 1.5rem;
        color: #f8fafc;
      }

      .header .badge {
        background: #10b981;
        color: white;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.75rem;
        font-weight: 600;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 30px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
      }

      @media (max-width: 900px) {
        .container {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: #1e293b;
        border-radius: 12px;
        border: 1px solid #334155;
        overflow: hidden;
      }

      .card-header {
        padding: 16px 20px;
        border-bottom: 1px solid #334155;
        font-weight: 600;
        font-size: 0.9rem;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .card-body {
        padding: 20px;
      }

      /* Upload area */
      .upload-area {
        border: 2px dashed #475569;
        border-radius: 12px;
        padding: 40px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
      }

      .upload-area:hover,
      .upload-area.dragover {
        border-color: #3b82f6;
        background: rgba(59, 130, 246, 0.05);
      }

      .upload-area .icon {
        font-size: 3rem;
        margin-bottom: 10px;
      }
      .upload-area p {
        color: #94a3b8;
        margin-top: 8px;
      }

      .upload-area input[type="file"] {
        display: none;
      }

      /* Preview */
      .preview-img {
        width: 100%;
        border-radius: 8px;
        margin-top: 15px;
        display: none;
      }

      /* Button */
      .btn {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        margin-top: 15px;
        transition: background 0.2s;
      }

      .btn:hover {
        background: #2563eb;
      }
      .btn:disabled {
        background: #475569;
        cursor: not-allowed;
      }

      .btn.loading::after {
        content: "";
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid white;
        border-top-color: transparent;
        border-radius: 50%;
        margin-left: 8px;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Results */
      .results {
        display: none;
      }
      .results.show {
        display: block;
      }

      .extracted-data {
        display: grid;
        gap: 12px;
        margin-bottom: 20px;
      }

      .data-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 14px;
        background: #0f172a;
        border-radius: 8px;
      }

      .data-row .label {
        min-width: 80px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        color: #64748b;
        padding-top: 2px;
      }

      .data-row .value {
        color: #f1f5f9;
        font-size: 0.95rem;
        word-break: break-word;
      }

      /* Lines table */
      .lines-table {
        width: 100%;
        font-size: 0.85rem;
        border-collapse: collapse;
      }

      .lines-table th {
        text-align: left;
        padding: 8px 10px;
        color: #64748b;
        font-weight: 600;
        border-bottom: 1px solid #334155;
      }

      .lines-table td {
        padding: 6px 10px;
        border-bottom: 1px solid #1e293b;
        vertical-align: middle;
      }

      .lines-table tr:hover {
        background: rgba(59, 130, 246, 0.05);
      }

      /* Label badges */
      .label-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.7rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .label-STORE {
        background: #ef444433;
        color: #fca5a5;
      }
      .label-ADDRESS_CONTACT {
        background: #3b82f633;
        color: #93c5fd;
      }
      .label-DATE {
        background: #10b98133;
        color: #6ee7b7;
      }
      .label-ITEM_DESC {
        background: #f59e0b33;
        color: #fcd34d;
      }
      .label-ITEM_PRICE\/QTY {
        background: #8b5cf633;
        color: #c4b5fd;
      }
      .label-TOTAL_PAYMENT {
        background: #ef444466;
        color: #fca5a5;
        border: 1px solid #ef4444;
      }
      .label-OTHER {
        background: #47556933;
        color: #94a3b8;
      }

      .confidence {
        font-size: 0.7rem;
        color: #64748b;
      }

      /* Stats bar */
      .stats-bar {
        display: flex;
        gap: 20px;
        padding: 12px 20px;
        background: #0f172a;
        border-radius: 8px;
        margin-bottom: 15px;
      }

      .stat-item {
        text-align: center;
      }

      .stat-item .num {
        font-size: 1.3rem;
        font-weight: 700;
        color: #3b82f6;
      }

      .stat-item .desc {
        font-size: 0.7rem;
        color: #64748b;
        text-transform: uppercase;
      }

      .full-width {
        grid-column: 1 / -1;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>🧾 OCR FinSight</h1>
      <span class="badge">Model V2 • BiLSTM + Attention</span>
    </div>

    <div class="container">
      <!-- Left: Upload -->
      <div class="card">
        <div class="card-header">📤 Upload Receipt</div>
        <div class="card-body">
          <div class="upload-area" id="uploadArea">
            <div class="icon">📷</div>
            <strong>Klik atau drag gambar receipt</strong>
            <p>JPG, PNG • Max 10MB</p>
            <input type="file" id="fileInput" accept="image/*" />
          </div>
          <img class="preview-img" id="previewImg" />
          <button class="btn" id="scanBtn" disabled>🔍 Scan Receipt</button>
        </div>
      </div>

      <!-- Right: Extracted Data -->
      <div class="card results" id="resultsCard">
        <div class="card-header">📊 Hasil Ekstraksi</div>
        <div class="card-body">
          <div class="stats-bar" id="statsBar"></div>
          <div class="extracted-data" id="extractedData"></div>
        </div>
      </div>

      <!-- Bottom: Annotated Image -->
      <div class="card results full-width" id="annotatedCard">
        <div class="card-header">🖼️ Annotated Image</div>
        <div class="card-body">
          <img id="annotatedImg" style="width: 100%; border-radius: 8px" />
        </div>
      </div>

      <!-- Bottom: All Lines -->
      <div class="card results full-width" id="linesCard">
        <div class="card-header">📋 Detail Per Baris</div>
        <div class="card-body" style="max-height: 400px; overflow-y: auto">
          <table class="lines-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Text</th>
                <th>Label</th>
                <th>Conf</th>
              </tr>
            </thead>
            <tbody id="linesBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const uploadArea = document.getElementById("uploadArea");
      const fileInput = document.getElementById("fileInput");
      const previewImg = document.getElementById("previewImg");
      const scanBtn = document.getElementById("scanBtn");
      let selectedFile = null;

      // Upload area click
      uploadArea.addEventListener("click", () => fileInput.click());

      // Drag & drop
      uploadArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadArea.classList.add("dragover");
      });
      uploadArea.addEventListener("dragleave", () =>
        uploadArea.classList.remove("dragover"),
      );
      uploadArea.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadArea.classList.remove("dragover");
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
      });

      // File selected
      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length) handleFile(e.target.files[0]);
      });

      function handleFile(file) {
        selectedFile = file;
        const reader = new FileReader();
        reader.onload = (e) => {
          previewImg.src = e.target.result;
          previewImg.style.display = "block";
        };
        reader.readAsDataURL(file);
        scanBtn.disabled = false;

        // Hide previous results
        document
          .querySelectorAll(".results")
          .forEach((el) => el.classList.remove("show"));
      }

      // Scan button
      scanBtn.addEventListener("click", async () => {
        if (!selectedFile) return;

        scanBtn.disabled = true;
        scanBtn.classList.add("loading");
        scanBtn.textContent = "Scanning...";

        const formData = new FormData();
        formData.append("image", selectedFile);

        try {
          const res = await fetch("/api/predict", {
            method: "POST",
            body: formData,
          });
          const data = await res.json();

          if (data.error) {
            alert("Error: " + data.error);
            return;
          }

          displayResults(data);
        } catch (err) {
          alert("Error: " + err.message);
        } finally {
          scanBtn.disabled = false;
          scanBtn.classList.remove("loading");
          scanBtn.textContent = "🔍 Scan Receipt";
        }
      });

      function displayResults(data) {
        // Show cards
        document
          .querySelectorAll(".results")
          .forEach((el) => el.classList.add("show"));

        // Stats
        document.getElementById("statsBar").innerHTML = `
                <div class="stat-item"><div class="num">${data.stats.total_lines}</div><div class="desc">Lines</div></div>
                <div class="stat-item"><div class="num">${data.stats.avg_confidence}%</div><div class="desc">Confidence</div></div>
                <div class="stat-item"><div class="num">${data.extracted.total_items}</div><div class="desc">Items</div></div>
            `;

        // Extracted data
        const ext = data.extracted;
        document.getElementById("extractedData").innerHTML = `
                <div class="data-row"><div class="label">🏪 Store</div><div class="value">${ext.store}</div></div>
                <div class="data-row"><div class="label">📅 Date</div><div class="value">${ext.date}</div></div>
                <div class="data-row"><div class="label">📦 Items</div><div class="value">${ext.items.join("<br>") || "N/A"}</div></div>
                <div class="data-row"><div class="label">💰 Total</div><div class="value">${ext.total}</div></div>
            `;

        // Annotated image
        document.getElementById("annotatedImg").src =
          "data:image/jpeg;base64," + data.annotated_image;

        // Lines table
        const tbody = document.getElementById("linesBody");
        tbody.innerHTML = data.lines
          .map(
            (line, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${line.text}</td>
                    <td><span class="label-badge label-${line.label}">${line.label}</span></td>
                    <td class="confidence">${Math.round(line.confidence * 100)}%</td>
                </tr>
            `,
          )
          .join("");
      }
    </script>
  </body>
</html>
